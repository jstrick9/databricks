# /data_quality/allowed_values/ph_action_codes.yml
CTNF: CTNF    # Non-Final Office Action	- Starts response clock
CTFR: CTFR    # Final Office Action -	Critical deadline
CTRE: CTRE    # Examiner's Amendment - Often positive
EXPT: EXPT    # Examiner's Action	- General action
NOA1: NOA1    # Notice of Allowance	- Near registration
REGI: REGI    # Registration - End of prosecution
ABAN: ABAN    # Abandonment	- Case closed
SUSP: SUSP    # Suspension - Clock paused
APRE: APRE    # Approved for Publication - Pre-publication
PUBO: PUBO    # Published for Opposition - 30-day opposition period