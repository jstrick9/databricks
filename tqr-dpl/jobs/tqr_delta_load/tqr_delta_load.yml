resources:
  jobs:
    tqr_delta_load_clone:
      name: tqr_delta_load
      schedule:
        quartz_cron_expression: 0 19 18 * * ?
        timezone_id: America/New_York
        pause_status: UNPAUSED
      tasks:
        - task_key: delta_silver_load_src_trm_application
          depends_on:
            - task_key: delta_silver_load_trm_application_event
          notebook_task:
            notebook_path: notebooks/python/silver/ntb_tqr_silver_src_trm_application
            base_parameters:
              dbx_env: ${var.environment}
            source: GIT
          job_cluster_key: Job_cluster
          email_notifications:
            on_success:
              - rkoppula1@uspto.gov
            on_failure:
              - rkoppula1@uspto.gov
        - task_key: delta_silver_load_trm_application_event
          notebook_task:
            notebook_path: notebooks/python/silver/ntb_tqr_silver_src_trm_application_event
            base_parameters:
              dbx_env: ${var.environment}
            source: GIT
          job_cluster_key: Job_cluster
          max_retries: 2
          min_retry_interval_millis: 60000
        - task_key: delta_silver_load_law_office
          depends_on:
            - task_key: delta_silver_load_src_trm_application
          notebook_task:
            notebook_path: notebooks/python/silver/ntb_tqr_silver_employee_organization
            base_parameters:
              dbx_env: ${var.environment}
            source: GIT
          job_cluster_key: Job_cluster
          max_retries: 2
          min_retry_interval_millis: 60000
        - task_key: delta_silver_trm_filing_basis
          depends_on:
            - task_key: delta_silver_load_src_trm_application
          notebook_task:
            notebook_path: notebooks/python/silver/ntb_tqr_silver_src_trm_filing_basis
            base_parameters:
              dbx_env: ${var.environment}
            source: GIT
          job_cluster_key: Job_cluster
          max_retries: 2
          min_retry_interval_millis: 60000
        - task_key: load_stage_tm_first
          depends_on:
            - task_key: load_stage_sou
          notebook_task:
            notebook_path: notebooks/python/silver/ntb_tqr_silver_event_inventory_stage_first_tm_exam
            base_parameters:
              dbx_env: ${var.environment}
            source: GIT
          job_cluster_key: Job_cluster
          max_retries: 2
          min_retry_interval_millis: 60000
        - task_key: delta_gold_load_event_inventory
          depends_on:
            - task_key: load_stage_tm_first
            - task_key: load_stage_tm_final
          notebook_task:
            notebook_path: notebooks/python/gold/ntb_tqr_gold_event_inventory
            base_parameters:
              dbx_env: ${var.environment}
            source: GIT
          job_cluster_key: Job_cluster
          max_retries: 2
          min_retry_interval_millis: 60000
        - task_key: Sync_delta_load_to_mysql
          depends_on:
            - task_key: delta_gold_load_event_inventory
          notebook_task:
            notebook_path: notebooks/python/ext_dataload/ntb_mysql_bdr_event_inventory_load_dsu
            base_parameters:
              dbx_env: ${var.environment}
            source: GIT
          job_cluster_key: Job_cluster
          max_retries: 2
          min_retry_interval_millis: 60000
        - task_key: load_stage_tm_final
          notebook_task:
            notebook_path: notebooks/python/silver/ntb_tqr_silver_event_inventory_stage_final_tm_exam
            base_parameters:
              dbx_env: ${var.environment}
            source: GIT
          job_cluster_key: Job_cluster
          max_retries: 2
          min_retry_interval_millis: 120000
        - task_key: load_stage_pub
          depends_on:
            - task_key: delta_silver_trm_filing_basis
          notebook_task:
            notebook_path: notebooks/python/silver/ntb_tqr_silver_event_inventory_stage_pub
            base_parameters:
              dbx_env: ${var.environment}
            source: GIT
          job_cluster_key: Job_cluster
          max_retries: 2
          min_retry_interval_millis: 180000
        - task_key: load_stage_sou
          depends_on:
            - task_key: load_stage_pub
          notebook_task:
            notebook_path: notebooks/python/silver/ntb_tqr_silver_event_inventory_stage_sou
            base_parameters:
              dbx_env: ${var.environment}
            source: GIT
          job_cluster_key: Job_cluster
          max_retries: 2
          min_retry_interval_millis: 240000
      job_clusters:
        - job_cluster_key: Job_cluster
          new_cluster:
            policy_id: ${var.policy_id}
            cluster_name: ""
            spark_version: ${var.runtime}
            aws_attributes:
              first_on_demand: 1
              availability: SPOT_WITH_FALLBACK
              zone_id: us-east-1a
              instance_profile_arn: ${var.instance_profile_arn}
              spot_bid_price_percent: 100
              ebs_volume_count: 0
            node_type_id: i4i.large
            custom_tags:
              Component: TMDC
              ComponentID: ${var.ComponentID}
              Environment: ${var.environment}
            enable_elastic_disk: false
            data_security_mode: SINGLE_USER
            runtime_engine: STANDARD
            autoscale:
              min_workers: 2
              max_workers: 8
      git_source:
        git_url: https://prod-cicm.uspto.gov/gitlab/tm-tmdc/tqr-dpl.git
        git_provider: gitLabEnterpriseEdition
        git_branch: ${var.git_branch}
      tags:
        Component: TMDC
        ComponentID: ${var.ComponentID}
        Environment: ${var.environment}
      run_as:
        service_principal_name: c0e8744c-4859-4397-b822-2f629cf629dc
permissions:
  - level: ${var.editor}
    group_name: ${var.editorteam}
  - level: ${var.reader}
    group_name: ${var.readerteam}
  - level: CAN_MANAGE
    service_principal_name: c0e8744c-4859-4397-b822-2f629cf629dc

