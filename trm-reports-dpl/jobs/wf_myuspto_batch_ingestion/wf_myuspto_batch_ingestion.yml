resources:
  jobs:
    wf_myuspto_batch_ingestion: 
      name: wf_myuspto_batch_ingestion
      description: |-
        A workflow used to ingest data from the MyUSPTO data source (MySQL Aurora).
      email_notifications:
        on_failure:
          - ODBDDataLakeTeam@uspto.gov
      timeout_seconds: 14400
      schedule:
        quartz_cron_expression: 0 0 10 ? * * *
        timezone_id: America/New_York
        pause_status: PAUSED
      tasks:
        - task_key: job_mysql_probe
          notebook_task:
            notebook_path: notebooks/python/myuspto/ntb_mysql_probe
            base_parameters:
              dbx_env: ${var.environment}
            source: GIT
          job_cluster_key: myuspto_ingest_cluster
        - task_key: job_myuspto_bronze_load
          depends_on:
            - task_key: job_mysql_probe
          for_each_task:
            inputs: "{{tasks.job_mysql_probe.values.tables}}"
            concurrency: 4
            task:
              task_key: job_myuspto_bronze_load_input_table
              notebook_task:
                notebook_path: notebooks/python/myuspto/ntb_myuspto_bronze_load
                base_parameters:
                  dbx_env: ${var.environment}
                  table: "{{input}}"
                source: GIT
              job_cluster_key: myuspto_ingest_cluster
      job_clusters:
        - job_cluster_key: myuspto_ingest_cluster
          new_cluster:
            policy_id: ${var.policy_id}
            cluster_name: ""
            spark_version: ${var.runtime}
            aws_attributes:
              first_on_demand: 1
              availability: SPOT_WITH_FALLBACK
              zone_id: auto
              instance_profile_arn: ${var.instance_profile_arn}
              spot_bid_price_percent: 100
              ebs_volume_count: 0
            node_type_id: i4i.xlarge
            custom_tags:
              Environment: ${var.environment}
              GroupName: Trademark
              ComponentID: ${var.ComponentID}
              Team: product
              Component: TMDC
              SubGroup: Trm-reports
            spark_env_vars:
              PYSPARK_PYTHON: /databricks/python3/bin/python3
            enable_elastic_disk: false
            data_security_mode: SINGLE_USER
            runtime_engine: STANDARD
            autoscale:
              min_workers: 4
              max_workers: 6
      git_source:
        git_url: https://prod-cicm.uspto.gov/gitlab/tm-tmdc/trm-reports-dpl.git
        git_provider: gitLabEnterpriseEdition
        git_branch: ${var.git_branch}
      tags:
        Environment: ${var.environment}
      queue:
        enabled: true
      run_as:
        service_principal_name: c0e8744c-4859-4397-b822-2f629cf629dc
permissions:
  - level: ${var.editor}
    group_name: ${var.editorteam}
  - level: ${var.reader}
    group_name: ${var.readerteam}
  - level: ${var.trademark}
    group_name: ${var.trademarkteam}
  - level: CAN_MANAGE
    service_principal_name: c0e8744c-4859-4397-b822-2f629cf629dc