resources:
  jobs:
    wf_trmreports_epquery_stg_live:
      name: wf_trmreports_epquery_stg_live
      email_notifications:
        on_success:
          - ODBDDataLakeTeam@uspto.gov
        on_failure:
          - ODBDDataLakeTeam@uspto.gov
      timeout_seconds: 3600
      trigger:
        pause_status: PAUSED
        file_arrival:
          url: s3://bdr-databricks-app-${var.environment}/eds/stream_logs/production_transaction_live/
      tasks:
        - task_key: job_EPQuery_stg
          notebook_task:
            notebook_path: notebooks/python/second_level_etl/ntb_silver_epquery_stg_live
            base_parameters:
              dbx_env: ${var.environment}
              config_file: ../config/${var.environment}/trmreports-conf.yaml
            source: GIT
          job_cluster_key: job_wf_altx_dataload_cluster
      job_clusters:
        - job_cluster_key: job_wf_altx_dataload_cluster
          new_cluster:
            policy_id: ${var.policy_id}
            cluster_name: ""
            spark_version: ${var.runtime}
            aws_attributes:
              first_on_demand: 1
              availability: SPOT_WITH_FALLBACK
              zone_id: auto
              instance_profile_arn: ${var.instance_profile_arn}
              spot_bid_price_percent: 100
              ebs_volume_count: 0
            node_type_id: i4i.xlarge
            custom_tags:
              Environment: ${var.environment}
              GroupName: Trademark
              ComponentID: ${var.ComponentID}
              Team: product
              Component: TMDC
              SubGroup: Trm-reports
            enable_elastic_disk: true
            data_security_mode: USER_ISOLATION
            runtime_engine: STANDARD
            autoscale:
              min_workers: 2
              max_workers: 8
      git_source:
        git_url: https://prod-cicm.uspto.gov/gitlab/tm-tmdc/trm-reports-dpl.git
        git_provider: gitLabEnterpriseEdition
        git_branch: ${var.git_branch}
      run_as:
        service_principal_name: c0e8744c-4859-4397-b822-2f629cf629dc
permissions:
  - level: ${var.editor}
    group_name: ${var.editorteam}
  - level: ${var.reader}
    group_name: ${var.readerteam}
  - level: ${var.trademark}
    group_name: ${var.trademarkteam}
  - level: CAN_MANAGE
    service_principal_name: c0e8744c-4859-4397-b822-2f629cf629dc
