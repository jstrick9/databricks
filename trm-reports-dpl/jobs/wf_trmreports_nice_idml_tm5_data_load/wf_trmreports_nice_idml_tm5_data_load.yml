resources:
  jobs:
    wf_trmreports_nice_idml_tm5_data_load:
      name: wf_trmreports_nice_idml_tm5_data_load
      email_notifications:
        on_failure:
          - ODBDSystemsEng@uspto.gov
        no_alert_for_skipped_runs: true
      notification_settings:
        no_alert_for_skipped_runs: true
        no_alert_for_canceled_runs: true
      schedule:
        quartz_cron_expression: 55 0 6 1 * ?
        timezone_id: UTC
        pause_status: PAUSED
      tasks:
        - task_key: job_bronze_nice_tm5_json_file_load
          notebook_task:
            notebook_path: notebooks/python/first_level_etl/ntb_bronze_nice_tm5_json_file_load
            base_parameters:
              dbx_env: ${var.environment}
            source: GIT
          job_cluster_key: fee_issue_alert_trigger_cluster
      job_clusters:
        - job_cluster_key: fee_issue_alert_trigger_cluster
          new_cluster:
            policy_id: ${var.policy_id}
            cluster_name: ""
            spark_version: ${var.runtime}
            aws_attributes:
              first_on_demand: 1
              availability: SPOT_WITH_FALLBACK
              zone_id: auto
              instance_profile_arn: ${var.instance_profile_arn}
              spot_bid_price_percent: 100
              ebs_volume_count: 0
            node_type_id: i4i.large
            custom_tags:
              Environment: ${var.environment}
              GroupName: Trademark
              ComponentID: ${var.ComponentID}
              Team: product
              Component: TMDC
              SubGroup: Trm-reports
            enable_elastic_disk: false
            data_security_mode: SINGLE_USER
            runtime_engine: STANDARD
            autoscale:
              min_workers: 2
              max_workers: 3
      git_source:
        git_url: https://prod-cicm.uspto.gov/gitlab/tm-tmdc/trm-reports-dpl.git
        git_provider: gitLabEnterpriseEdition
        git_branch: ${var.git_branch}
      run_as:
        service_principal_name: c0e8744c-4859-4397-b822-2f629cf629dc
permissions:
  - level: ${var.editor}
    group_name: ${var.editorteam}
  - level: ${var.reader}
    group_name: ${var.readerteam}
  - level: ${var.trademark}
    group_name: ${var.trademarkteam}
  - level: CAN_MANAGE
    service_principal_name: c0e8744c-4859-4397-b822-2f629cf629dc
