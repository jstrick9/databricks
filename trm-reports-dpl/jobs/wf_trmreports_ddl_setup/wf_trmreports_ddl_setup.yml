resources:
  jobs:
    wf_trmreports_ddl_setup:
      name: wf_trmreports_ddl_setup
      email_notifications:
        on_failure:
          - ODBDDataLakeTeam@uspto.gov
      tasks:
        - task_key: common_proc_reference
          notebook_task:
            notebook_path: notebooks/python/shared/ntb_cmn_trm_reports_proc_defn_rfrnc_load_v2
            base_parameters:
              dbx_env: ${var.environment}
            source: GIT
          job_cluster_key: Job_cluster
          libraries:
            - pypi:
                package: pyyaml
        - task_key: ddls_bronze_tables
          notebook_task:
            notebook_path: notebooks/sql/ddls/ddls_bronze_tables
            base_parameters:
              dbx_env: ${var.environment}
            source: GIT
          job_cluster_key: Job_cluster
          libraries:
            - pypi:
                package: pyyaml
        - task_key: ddls_gold_tables
          notebook_task:
            notebook_path: notebooks/sql/ddls/ddls_gold_tables
            base_parameters:
              dbx_env: ${var.environment}
            source: GIT
          job_cluster_key: Job_cluster
          libraries:
            - pypi:
                package: pyyaml
        - task_key: ddls_self_service
          notebook_task:
            notebook_path: notebooks/sql/ddls/ddls_self_service_catalog
            base_parameters:
              dbx_env: ${var.environment}
            source: GIT
          job_cluster_key: Job_cluster
          libraries:
            - pypi:
                package: pyyaml
        - task_key: ddls_silver_tables
          notebook_task:
            notebook_path: notebooks/sql/ddls/ddls_silver_tables
            base_parameters:
              dbx_env: ${var.environment}
            source: GIT
          job_cluster_key: Job_cluster
          libraries:
            - pypi:
                package: pyyaml
      job_clusters:
        - job_cluster_key: Job_cluster
          new_cluster:
            policy_id: ${var.policy_id}
            cluster_name: ""
            spark_version: ${var.runtime}
            aws_attributes:
              first_on_demand: 1
              availability: SPOT_WITH_FALLBACK
              zone_id: auto
              instance_profile_arn: ${var.instance_profile_arn}
              spot_bid_price_percent: 100
              ebs_volume_count: 0
            node_type_id: i4i.xlarge
            custom_tags:
              Environment: ${var.environment}
              GroupName: Trademark
              ComponentID: ${var.ComponentID}
              Team: product
              Component: TMDC
              SubGroup: Trm-reports
            spark_env_vars:
              PYSPARK_PYTHON: /databricks/python3/bin/python3
            enable_elastic_disk: false
            data_security_mode: SINGLE_USER
            runtime_engine: STANDARD
            autoscale:
              min_workers: 2
              max_workers: 8
      git_source:
        git_url: https://prod-cicm.uspto.gov/gitlab/tm-tmdc/trm-reports-dpl.git
        git_provider: gitLabEnterpriseEdition
        git_branch: ${var.git_branch}
      run_as:
        service_principal_name: c0e8744c-4859-4397-b822-2f629cf629dc
permissions:
  - level: ${var.editor}
    group_name: ${var.editorteam}
  - level: ${var.reader}
    group_name: ${var.readerteam}
  - level: ${var.trademark}
    group_name: ${var.trademarkteam}
  - level: CAN_MANAGE
    service_principal_name: c0e8744c-4859-4397-b822-2f629cf629dc
