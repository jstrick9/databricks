resources:
  jobs:
    wf_tmns_reports_data_load:
      name: wf_tmns_reports_data_load
      email_notifications:
        on_success:
          - Pawanpreet.Sangari@USPTO.GOV
        on_failure:
          - Pawanpreet.Sangari@USPTO.GOV
          - ODBDSystemsEng@uspto.gov
        no_alert_for_skipped_runs: true
      notification_settings:
        no_alert_for_skipped_runs: true
        no_alert_for_canceled_runs: true
      schedule:
        quartz_cron_expression: 55 0 6 1 * ?
        timezone_id: UTC
        pause_status: PAUSED
      tasks:
        - task_key: job_bronze_tmns_json_file_load
          notebook_task:
            notebook_path: notebooks/python/first_level_etl/ntb_bronze_tmns_json_file_load
            base_parameters:
              dbx_env: ${var.environment}
            source: GIT
          job_cluster_key: job_data_load_cluster
        - task_key: job_gold_tmns_report_data
          depends_on:
            - task_key: job_bronze_tmns_json_file_load
          notebook_task:
            notebook_path: notebooks/python/third_level_etl/ntb_gold_tmns_report_data
            base_parameters:
              dbx_env: ${var.environment}
            source: GIT
          job_cluster_key: job_data_load_cluster
      job_clusters:
        - job_cluster_key: job_data_load_cluster
          new_cluster:
            policy_id: ${var.policy_id}
            cluster_name: ""
            spark_version: ${var.runtime}
            spark_conf:
              spark.sql.files.ignoreMissingFiles: "true"
            aws_attributes:
              first_on_demand: 1
              availability: SPOT_WITH_FALLBACK
              zone_id: auto
              instance_profile_arn: ${var.instance_profile_arn}
              spot_bid_price_percent: 100
              ebs_volume_count: 0
            node_type_id: i4i.large
            custom_tags:
              team: product
              Component: TMDC
              Environment: ${var.environment}
              ComponentID: ${var.ComponentID}
            cluster_log_conf:
              s3:
                destination: s3://bdr-databricks-app-${var.environment}/auditlogs-data/1025-213227-u87y9ym6
                  (us-east-1)
                region: us-west-2
                enable_encryption: true
                canned_acl: bucket-owner-full-control
            spark_env_vars:
              SPARK_VERSION: "3.2"
            enable_elastic_disk: true
            data_security_mode: SINGLE_USER
            runtime_engine: STANDARD
            autoscale:
              min_workers: 4
              max_workers: 6
      git_source:
        git_url: https://prod-cicm.uspto.gov/gitlab/tm-tmdc/trm-reports-dpl.git
        git_provider: gitLabEnterpriseEdition
        git_branch: ${var.git_branch}
      run_as:
        service_principal_name: c0e8744c-4859-4397-b822-2f629cf629dc
permissions:
  - level: ${var.editor}
    group_name: ${var.editorteam}
  - level: ${var.reader}
    group_name: ${var.readerteam}
  - level: ${var.trademark}
    group_name: ${var.trademarkteam}
  - level: CAN_MANAGE
    service_principal_name: c0e8744c-4859-4397-b822-2f629cf629dc

