resources:
  jobs:
    wf_trmreports_production_simulator:
      name: wf_trmreports_production_simulator
      email_notifications:
        on_success:
          - ODBDDataLakeTeam@uspto.gov
          - ODBDSystemsOps@uspto.gov
        on_failure:
          - ODBDDataLakeTeam@uspto.gov
          - ODBDSystemsOps@uspto.gov
      schedule:
        quartz_cron_expression: 31 0 1/8 * * ?
        timezone_id: America/New_York
        pause_status: UNPAUSED
      tasks:
        - task_key: ntb_silver_production_simulator_bi_week
          notebook_task:
            notebook_path: notebooks/python/second_level_etl/ntb_silver_production_simulator_bi_week
            base_parameters:
              dbx_env: ${var.environment}
            source: GIT
          job_cluster_key: job_wf_trmreports_production_simulator
        - task_key: ntb_silver_production_simulator_prod_qual
          depends_on:
              - task_key: ntb_silver_production_simulator_bi_week
          notebook_task:
            notebook_path: notebooks/python/second_level_etl/ntb_silver_production_simulator_prod_qual
            base_parameters:
              dbx_env: ${var.environment}
            source: GIT
          job_cluster_key: job_wf_trmreports_production_simulator
          max_retries: 2
        - task_key: ntb_gold_production_simulator
          depends_on:
              - task_key: ntb_silver_production_simulator_prod_qual
          notebook_task:
            notebook_path: notebooks/python/third_level_etl/ntb_gold_production_simulator
            base_parameters:
              dbx_env: ${var.environment}
            source: GIT
          job_cluster_key: job_wf_trmreports_production_simulator
      job_clusters:
        - job_cluster_key: job_wf_trmreports_production_simulator
          new_cluster:
            policy_id: ${var.policy_id}
            cluster_name: ""
            spark_version: ${var.runtime}
            aws_attributes:
              first_on_demand: 1
              availability: SPOT_WITH_FALLBACK
              zone_id: auto
              instance_profile_arn: ${var.instance_profile_arn}
              spot_bid_price_percent: 100
            node_type_id: i4i.large
            custom_tags:
              Environment: ${var.environment}
              GroupName: Trademark
              ComponentID: ${var.ComponentID}
              Team: product
              Component: TMDC
              SubGroup: Trm-reports
            enable_elastic_disk: true
            data_security_mode: SINGLE_USER
            runtime_engine: STANDARD
            autoscale:
              min_workers: 2
              max_workers: 8
      git_source:
        git_url: https://prod-cicm.uspto.gov/gitlab/tm-tmdc/trm-reports-dpl.git
        git_provider: gitLabEnterpriseEdition
        git_branch: ${var.git_branch}
      run_as:
        service_principal_name: c0e8744c-4859-4397-b822-2f629cf629dc
permissions:
  - level: ${var.editor}
    group_name: ${var.editorteam}
  - level: ${var.reader}
    group_name: ${var.readerteam}
  - level: ${var.trademark}
    group_name: ${var.trademarkteam}
  - level: CAN_MANAGE
    service_principal_name: c0e8744c-4859-4397-b822-2f629cf629dc
