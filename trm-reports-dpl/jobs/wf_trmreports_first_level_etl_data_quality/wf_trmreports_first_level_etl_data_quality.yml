resources:
  jobs:
    wf_trmreports_first_level_etl_data_quality:
      name: wf_trmreports_first_level_etl_data_quality
      email_notifications:
        on_success:
          - ODBDDataLakeTeam@uspto.gov
          - ODBDSystemsOps@uspto.gov
        on_failure:
          - ODBDDataLakeTeam@uspto.gov
          - ODBDSystemsOps@uspto.gov
      schedule:
        quartz_cron_expression: 0 0 6 * * ?
        timezone_id: America/New_York
        pause_status: PAUSED
      tasks:
        - task_key: bibliography_dq
          notebook_task:
            notebook_path: notebooks/python/data_quality/ntb_dq_bibliography
            base_parameters:
              dbx_env: ${var.environment}
            source: GIT
          job_cluster_key: job_wf_altx_dataload_cluster
        - task_key: class_dq
          notebook_task:
            notebook_path: notebooks/python/data_quality/ntb_dq_class
            base_parameters:
              dbx_env: ${var.environment}
            source: GIT
          job_cluster_key: job_wf_altx_dataload_cluster
        - task_key: correspondence_dq
          notebook_task:
            notebook_path: notebooks/python/data_quality/ntb_dq_correspondence
            base_parameters:
              dbx_env: ${var.environment}
            source: GIT
          job_cluster_key: job_wf_altx_dataload_cluster
        - task_key: milestone_dq
          notebook_task:
            notebook_path: notebooks/python/data_quality/ntb_dq_milestone
            base_parameters:
              dbx_env: ${var.environment}
            source: GIT
          job_cluster_key: job_wf_altx_dataload_cluster
        - task_key: owner_dq
          notebook_task:
            notebook_path: notebooks/python/data_quality/ntb_dq_owner
            base_parameters:
              dbx_env: ${var.environment}
            source: GIT
          job_cluster_key: job_wf_altx_dataload_cluster
        - task_key: prosecution_history_dq
          notebook_task:
            notebook_path: notebooks/python/data_quality/ntb_dq_prosecution_history
            base_parameters:
              dbx_env: ${var.environment}
            source: GIT
          job_cluster_key: job_wf_altx_dataload_cluster
      job_clusters:
        - job_cluster_key: job_wf_altx_dataload_cluster
          new_cluster:
            policy_id: ${var.policy_id}
            cluster_name: ""
            spark_version: ${var.runtime}
            aws_attributes:
              first_on_demand: 1
              availability: SPOT_WITH_FALLBACK
              zone_id: auto
              instance_profile_arn: ${var.instance_profile_arn}
              spot_bid_price_percent: 100
              ebs_volume_count: 0
            node_type_id: i4i.xlarge
            custom_tags:
              Environment: ${var.environment}
              GroupName: Trademark
              ComponentID: ${var.ComponentID}
              Team: product
              Component: TMDC
              SubGroup: Trm-reports
            enable_elastic_disk: true
            data_security_mode: SINGLE_USER
            runtime_engine: STANDARD
            autoscale:
              min_workers: 2
              max_workers: 8
      git_source:
        git_url: https://prod-cicm.uspto.gov/gitlab/tm-tmdc/trm-reports-dpl.git
        git_provider: gitLabEnterpriseEdition
        git_branch: ${var.git_branch}
      run_as:
        service_principal_name: c0e8744c-4859-4397-b822-2f629cf629dc
permissions:
  - level: ${var.editor}
    group_name: ${var.editorteam}
  - level: ${var.reader}
    group_name: ${var.readerteam}
  - level: ${var.trademark}
    group_name: ${var.trademarkteam}
  - level: CAN_MANAGE
    service_principal_name: c0e8744c-4859-4397-b822-2f629cf629dc
