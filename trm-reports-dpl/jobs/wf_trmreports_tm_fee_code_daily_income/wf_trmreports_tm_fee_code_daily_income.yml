resources:
  jobs:
    wf_trmreports_tm_fee_code_daily_income:
      name: wf_trmreports_tm_fee_code_daily_income
      email_notifications:
        on_failure:
          - ODBDDataLakeTeam@uspto.gov
      timeout_seconds: 1680
      schedule:
        quartz_cron_expression: 56 50 2 * * ?
        timezone_id: America/New_York
        pause_status: UNPAUSED
      tasks:
          - task_key: job_trmreports_oracle_gate_keeper
            notebook_task:
              notebook_path: notebooks/python/shared/ntb_oracle_gatekeeper
              base_parameters:
                dbx_env: ${var.environment}
                config_file: ../config/${var.environment}/trmreports-conf.yaml
              source: GIT
            job_cluster_key: Job_cluster
            max_retries: 2
            min_retry_interval_millis: 10800000
          - task_key: ntb_tm_fee_code_daily_income
            depends_on:
              - task_key: job_trmreports_oracle_gate_keeper
            notebook_task:
              notebook_path: notebooks/python/trmreports/ntb_trmreports_tm_fee_code_daily_income
              base_parameters:
                dbx_env: ${var.environment}
              source: GIT
            job_cluster_key: Job_cluster
      job_clusters:
        - job_cluster_key: Job_cluster
          new_cluster:
            policy_id: ${var.policy_id}
            cluster_name: ""
            spark_version: ${var.runtime}
            aws_attributes:
              first_on_demand: 1
              availability: SPOT_WITH_FALLBACK
              zone_id: auto
              instance_profile_arn: ${var.instance_profile_arn}
              spot_bid_price_percent: 100
              ebs_volume_count: 0
            node_type_id: i4i.xlarge
            custom_tags:
              Environment: ${var.environment}
              GroupName: Trademark
              ComponentID: ${var.ComponentID}
              Team: product
              Component: TMDC
              SubGroup: Trm-reports
            spark_env_vars:
              PYSPARK_PYTHON: /databricks/python3/bin/python3
            enable_elastic_disk: false
            data_security_mode: SINGLE_USER
            runtime_engine: STANDARD
            autoscale:
              min_workers: 2
              max_workers: 8
      git_source:
        git_url: https://prod-cicm.uspto.gov/gitlab/tm-tmdc/trm-reports-dpl.git
        git_provider: gitLabEnterpriseEdition
        git_branch: ${var.git_branch}
      run_as:
        service_principal_name: c0e8744c-4859-4397-b822-2f629cf629dc
permissions:
  - level: ${var.editor}
    group_name: ${var.editorteam}
  - level: ${var.reader}
    group_name: ${var.readerteam}
  - level: ${var.trademark}
    group_name: ${var.trademarkteam}
  - level: CAN_MANAGE
    service_principal_name: c0e8744c-4859-4397-b822-2f629cf629dc
