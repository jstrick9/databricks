resources:
  jobs:
    wf_trmreports_prima_fascia_new_fps_report:
      name: wf_trmreports_prima_fascia_new_fps_report
      description: |-
        A scheduled workflow to alert users when cases contain fee issues.

        Based on the Alteryx Workflow: https://alteryx-server.uspto.gov/gallery/#!app/Fee-Issue-Alert/5e332a6f4543d410f816ecd1
      email_notifications:
        on_failure:
          - ODBDDataLakeTeam@uspto.gov
      schedule:
        quartz_cron_expression: 56 0 3 1 * ?
        timezone_id: America/New_York
        pause_status: UNPAUSED
      tasks:
        - task_key: job_prima_fascia_new_fps_report
          notebook_task:
            notebook_path: notebooks/python/trmreports/ntb_trmreports_prima_fascia_new_fps_report
            base_parameters:
              dbx_env: ${var.environment}
            source: GIT
          job_cluster_key: fee_issue_alert_trigger_cluster
      job_clusters:
        - job_cluster_key: fee_issue_alert_trigger_cluster
          new_cluster:
            policy_id: ${var.policy_id}
            cluster_name: ""
            spark_version: ${var.runtime}
            aws_attributes:
              first_on_demand: 1
              availability: SPOT_WITH_FALLBACK
              zone_id: auto
              instance_profile_arn: ${var.instance_profile_arn}
              spot_bid_price_percent: 100
              ebs_volume_count: 0
            node_type_id: i4i.large
            custom_tags:
              Environment: ${var.environment}
              GroupName: Trademark
              ComponentID: ${var.ComponentID}
              Team: product
              Component: TMDC
              SubGroup: Trm-reports
            enable_elastic_disk: false
            data_security_mode: SINGLE_USER
            runtime_engine: STANDARD
            autoscale:
              min_workers: 2
              max_workers: 3
      git_source:
        git_url: https://prod-cicm.uspto.gov/gitlab/tm-tmdc/trm-reports-dpl.git
        git_provider: gitLabEnterpriseEdition
        git_branch: ${var.git_branch}
      tags:
        Alert: ""
        Environment: ${var.environment}
        TRM Reporting: ""
        prima fascia: ""
      queue:
        enabled: true
      run_as:
        service_principal_name: c0e8744c-4859-4397-b822-2f629cf629dc
permissions:
  - level: ${var.editor}
    group_name: ${var.editorteam}
  - level: ${var.reader}
    group_name: ${var.readerteam}
  - level: ${var.trademark}
    group_name: ${var.trademarkteam}
  - level: CAN_MANAGE
    service_principal_name: c0e8744c-4859-4397-b822-2f629cf629dc

