resources:
  apps:
    app-tdet:
      name: app-tdet-${bundle.target}
      description: TDET - Serial Number Search Application for ${bundle.target}
      source_code_path: ../apps/app-tdet
      permissions:
        - level: ${var.app_editor}   # CAN_MANAGE
          group_name: ${var.editorteam}
        - level: ${var.app_reader}   # CAN_USE
          group_name: ${var.app_reader_user}