resources:
  jobs:
    wf_tdet_table_compaction:
      name: wf_tdet_table_compaction
      schedule:
        quartz_cron_expression: 0 0 1 ? * SAT
        timezone_id: America/New_York
        pause_status: UNPAUSED
      tasks:
        - task_key: ntb_cmn_tdet_compaction
          notebook_task:
            notebook_path: notebooks/shared/ntb_cmn_tdet_compaction
            base_parameters:
              dbx_env: ${var.environment}
              catalog: ${var.tdet_catalog}
            source: GIT
          job_cluster_key: Job_cluster
      job_clusters:
        - job_cluster_key: Job_cluster
          new_cluster:
            policy_id: ${var.policy_id}
            cluster_name: ""
            spark_version: ${var.runtime}
            aws_attributes:
              first_on_demand: 1
              availability: SPOT_WITH_FALLBACK
              zone_id: auto
              instance_profile_arn: ${var.instance_profile_arn}
              spot_bid_price_percent: 100
              ebs_volume_count: 0
            node_type_id: i4i.large
            custom_tags:
              Environment: ${var.environment}
              GroupName: Trademark
              ComponentID: ${var.ComponentID}
              Component: TMDC
              SubGroup: TRM
            spark_env_vars:
              PYSPARK_PYTHON: /databricks/python3/bin/python3
            enable_elastic_disk: false
            data_security_mode: SINGLE_USER
            runtime_engine: STANDARD
            autoscale:
              min_workers: 2
              max_workers: 8
      git_source:
        git_url: https://prod-cicm.uspto.gov/gitlab/tm-tmdc/tdet-dpl.git  
        git_provider: gitLabEnterpriseEdition
        git_branch: ${var.git_branch}
      run_as:
        service_principal_name: c0e8744c-4859-4397-b822-2f629cf629dc
permissions:
  - level: ${var.editor}
    group_name: ${var.editorteam}
  - level: ${var.reader}
    group_name: ${var.readerteam}
  - level: CAN_MANAGE
    service_principal_name: c0e8744c-4859-4397-b822-2f629cf629dc
