resources:
  pipelines:
    pipeline_tmprodvty_bronze_streaming_load:
      name: pipeline_tmprodvty_bronze_streaming_load
      configuration:
        dbx_env: ${var.environment}
        cdc_bucket: ${var.cdc_bucket}
      clusters:
        - label: default
          aws_attributes:
            instance_profile_arn: ${var.instance_profile_arn}
          node_type_id: i4i.xlarge
          #policy_id: ${var.policy_id}
          custom_tags:
            Environment: ${var.environment}
            ComponentID: ${var.ComponentID}
            Component: TMDC
            Team: Trademark
            SubGroup: TRM
            GroupName: Trademark
            wf_name: wf_tmprodvty_bronze_streaming_load_pipeline
          autoscale:
            min_workers: 2
            max_workers: 12
            mode: ENHANCED
        - label: maintenance
          aws_attributes:
            instance_profile_arn: ${var.instance_profile_arn}
          #policy_id: ${var.policy_id}
          custom_tags:
            Environment: ${var.environment}
            ComponentID: ${var.ComponentID}
            Component: TMDC
            Team: Trademark
      libraries:
        - notebook:
            path: ${workspace.root_path}/files/notebooks/python/bronze/ntb_tmprodvty_streaming_raw_data_load
        - notebook:
            path: ${workspace.root_path}/files/notebooks/python/bronze/ntb_tmprodvty_streaming_live_table_load
      target: bronze
      continuous: true
      development: false
      edition: ADVANCED
      catalog: ${var.trm_tmprodvty_catalog}
      channel: CURRENT
      photon: true
      notifications:
        - email_recipients:
            - jayanth.bandi@USPTO.GOV
            - ODBDDataLakeTeam@uspto.gov
          alerts:
            - on-update-failure
            - on-flow-failure
            - on-update-success

  jobs:
    wf_tmprodvty_bronze_streaming_load_pipeline:
      name: wf_tmprodvty_bronze_streaming_load_pipeline
      email_notifications:
        on_success:
          - jayanth.bandi@USPTO.GOV
        on_failure:
          - jayanth.bandi@USPTO.GOV
          - ODBDDataLakeTeam@uspto.gov
      notification_settings:
        no_alert_for_canceled_runs: true
      timeout_seconds: 9000
      tasks:
        - task_key: run_streaming_pipeline
          pipeline_task:
            pipeline_id: ${resources.pipelines.pipeline_tmprodvty_bronze_streaming_load.id}
            full_refresh: false
      run_as:
        service_principal_name: c0e8744c-4859-4397-b822-2f629cf629dc

permissions:
  - level: ${var.editor}
    group_name: ${var.editorteam}
  - level: ${var.reader}
    group_name: ${var.readerteam}
  - level: CAN_MANAGE
    service_principal_name: c0e8744c-4859-4397-b822-2f629cf629dc