resources:
  jobs:
    wf_tmngpdb_bronze_load_group5_jdbc_logs:
      name: wf_tmngpdb_bronze_load_group5_jdbc_logs
      email_notifications:
        on_success:
          - jayanth.bandi@USPTO.GOV
        on_failure:
          - jayanth.bandi@USPTO.GOV
          - ODBDDataLakeTeam@uspto.gov
      notification_settings:
        no_alert_for_canceled_runs: true
      timeout_seconds: 36000
      schedule:
        quartz_cron_expression: 58 0 3 * * ?
        timezone_id: America/New_York
        pause_status: UNPAUSED
      tasks:
        - task_key: job_tmngpdb_bronze_control_table_load_group5
          notebook_task:
            notebook_path: notebooks/python/bronze/ntb_cmn_bronze_job_control_load
            base_parameters:
              dbx_env: ${var.environment}
              SRC_SYS_NAME: TMNGPDB
              config_file: ../config/${var.environment}/tmngpdb-conf.yaml
              data_load_group: group5
            source: GIT
          job_cluster_key: job_wf_lom_data_load_cluster
        - task_key: job_tmngpdb_bronze_load_group5
          depends_on:
            - task_key: job_tmngpdb_bronze_control_table_load_group5
          for_each_task:
            inputs: '["STND_TM_MILESTONE","STND_FEE_PROCESS_TYPE","STND_MARK_DRAWING_TYPE","TM_GDS_SRVC_TERM_FILG_BASIS","TM_GDS_SRVC_TERM_FILG_BASIS_H","CUSTOM_ALERT","DOCKET_ITEM_EVENT_H","DOCUMENT_COMPONENT_RELTNSP","EVIDENCE_BIN_FOLDER_H","FORM_PARAGRAPH_RULE","IB_TRANSACTION","DOCUMENT_TEMPLATE_VERSION","EMPLOYEE_QUERY_APPEAL","EVIDENCE_DOCUMENT_H","DOC_TMPLT_VER_FORM_PARA","INTRSTD_PARTY_RELATIONSHIP","INTRSTD_PARTY_RELATIONSHIP_H","IR_MAILING_ADDRESS","IR_MAILING_ADDRESS_GROUP","MAILING_ADDRESS_LINE","MAILING_ADDRESS_LINE_H","QUERY_APPEAL_NOTE","REVIEW_ISSUE","REVIEW_QUERY","SECTION_2F_PRIOR_REG","SECTION_2F_PRIOR_REG_H","STND_ANNOTATION_STATUS","STND_APPEAL_RESULT","STND_APPEAL_STATUS","STND_ASSUMED_NAME_TYPE","STND_AVERMENT","STND_BUSINESS_EVENT_RSN_CT","STND_CATEGORY_DOC_TYPE","STND_CLASS_SCHEDULE","STND_CLASS_STATEMENT_TYPE","STND_COORDINATED_CLASS","STND_CREDIT_TRAN_RSN_TYPE","STND_DESIGN_SEARCH_GROUP_TYPE","STND_DOC_TYPE_CT","STND_DOCKET","STND_DOCKET_FSM_TYPE_STATE","STND_DOCKET_ITEM_EVENT_TYPE","STND_DOCUMENT_COMPONENT_TYPE","STND_DOCUMENT_TEMPLATE","STND_DOCUMENT_TYPE","STND_ELECTRONIC_ADDR_TYPE","STND_EVIDENCE_BIN","TM_CLASS_GDS_SRVC_TERM","TM_CLASS_GDS_SRVC_TERM_H","STND_EVIDENCE_SOURCE_CATEGORY","STND_FILING_BASIS","STND_FSM_CATEGORY","STND_FSM_STATE_LEGACY_STATE","STND_FSM_TYPE","STND_GDS_SRVC_ANNOTN_STAT","STND_GDS_SRVC_MATCH_STAT","STND_GDS_SRVC_STATUS","STND_GROUND","STND_GROUND_TYPE","STND_INTRSTD_PARTY_RLTNSP_TYPE","STND_LEGACY_TRANSACTION","STND_LEGAL_ENTITY_TYPE", "STND_MAD_BIRTH_REC_CT_TYPE","STND_MAD_TRANSACTION_TYPE", "STND_MARK_TYPE","STND_MYUSPTO_EVENT","STND_NOTE_TYPE","STND_OBJECT_DISPATCH_TYPE","STND_OBJECT_TYPE"]'
            concurrency: 5
            task:
              task_key: job_tmngpdb_bronze_load_group5_iteration
              notebook_task:
                notebook_path: notebooks/python/bronze/ntb_tmngpdb_bronze_jdbc_cdc_load_table_level
                base_parameters:
                  dbx_env: ${var.environment}
                  full_data_refresh: N
                  data_load_group: group5
                  SRC_SYS_NAME: TMNGPDB
                  config_file: ../config/${var.environment}/tmngpdb-conf.yaml
                  table_name: "{{input}}"
                source: GIT
              job_cluster_key: job_wf_lom_data_load_cluster
              min_retry_interval_millis: 60000
      job_clusters:
        - job_cluster_key: job_wf_lom_data_load_cluster
          new_cluster:
            policy_id: ${var.policy_id}
            cluster_name: ""
            spark_version: ${var.runtime}
            spark_conf:
              spark.sql.files.ignoreMissingFiles: "true"
            aws_attributes:
              first_on_demand: 1
              availability: SPOT_WITH_FALLBACK
              zone_id: auto
              instance_profile_arn: ${var.instance_profile_arn}
              spot_bid_price_percent: 100
            node_type_id: i4i.xlarge
            custom_tags:
              Environment: ${var.environment}
              GroupName: Trademark
              ComponentID: ${var.ComponentID}
              team: product
              Component: TMDC
              SubGroup: TRM
            cluster_log_conf:
              s3:
                destination: s3://bdr-databricks-app-${var.environment}/auditlogs-data/1025-213227-u87y9ym6
                  (us-east-1)
                region: us-west-2
                enable_encryption: true
                canned_acl: bucket-owner-full-control
            spark_env_vars:
              SPARK_VERSION: "3.2"
            enable_elastic_disk: true
            data_security_mode: SINGLE_USER
            runtime_engine: STANDARD
            autoscale:
              min_workers: 2
              max_workers: 12
      git_source:
        git_url: https://prod-cicm.uspto.gov/gitlab/tm-tmdc/trm-dpl.git
        git_provider: gitLabEnterpriseEdition
        git_branch: ${var.git_branch}
      run_as:
        service_principal_name: c0e8744c-4859-4397-b822-2f629cf629dc
permissions:
  - level: ${var.editor}
    group_name: ${var.editorteam}
  - level: ${var.reader}
    group_name: ${var.readerteam}
  - level: CAN_MANAGE
    service_principal_name: c0e8744c-4859-4397-b822-2f629cf629dc