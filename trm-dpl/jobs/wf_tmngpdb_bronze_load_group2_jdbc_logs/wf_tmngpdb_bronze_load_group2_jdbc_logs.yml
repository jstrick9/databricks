resources:
  jobs:
    wf_tmngpdb_bronze_load_group2_jdbc_logs:
      name: wf_tmngpdb_bronze_load_group2_jdbc_logs
      email_notifications:
        on_success:
          - jayanth.bandi@USPTO.GOV
        on_failure:
          - jayanth.bandi@USPTO.GOV
          - ODBDDataLakeTeam@uspto.gov
      notification_settings:
        no_alert_for_canceled_runs: true
      timeout_seconds: 43200
      schedule:
        quartz_cron_expression: 58 0 3 ? * MON-FRI
        timezone_id: America/New_York
        pause_status: UNPAUSED
      tasks:
        - task_key: job_tmngpdb_bronze_control_table_load_group2
          notebook_task:
            notebook_path: notebooks/python/bronze/ntb_cmn_bronze_job_control_load
            base_parameters:
              dbx_env: ${var.environment}
              SRC_SYS_NAME: TMNGPDB
              config_file: ../config/${var.environment}/tmngpdb-conf.yaml
              data_load_group: group2
            source: GIT
          job_cluster_key: job_wf_lom_data_load_cluster
        - task_key: job_tmngpdb_bronze_load_group2
          depends_on:
            - task_key: job_tmngpdb_bronze_control_table_load_group2
          for_each_task:
            inputs: '["ABANDONMENT_H","ABANDONMENT","ANNOTATION_COMMENT","BASE_APPLICATION","BASE_APPLICATION_H","CONCURRENT_USE","DOCKET_ITEM","DOCKET_ITEM_EVENT","DOCKET_ITEM_H","DRAFT_DOC_VER_COMPNT_FPV","DRAFT_DOCUMENT","DRAFT_DOCUMENT_VERSION","DRAFT_DOCUMENT_VERSION_COMPNT","ELECTRONIC_ADDRESS_H","EMPLOYEE_AWARD_WITHDRAW","EMPLOYEE_CREDIT_TRANSACTION","EMPLOYEE_REVIEW_QUERY","EMPLOYEE_REVIEW_QUERY_STAT","EMPLOYEE_TM_CLASS_CREDIT","EVIDENCE_BIN_FOLDER","EVIDENCE_DOCUMENT","FSM_INSTANCE","FSM_INSTANCE_H","GDS_SRVC_STMT_ANNOTATION","INTERESTED_PARTY_ASSUMED_NM","INTERESTED_PARTY_ASSUMED_NM_H","INTERNAL_NOTE","TRAM_UPD","TM_DRAWING","TM_DRAWING_H"]'
            concurrency: 5
            task:
              task_key: job_tmngpdb_bronze_load_group2_iteration
              notebook_task:
                notebook_path: notebooks/python/bronze/ntb_tmngpdb_bronze_jdbc_cdc_load_table_level
                base_parameters:
                  dbx_env: ${var.environment}
                  full_data_refresh: N
                  data_load_group: group2
                  SRC_SYS_NAME: TMNGPDB
                  config_file: ../config/${var.environment}/tmngpdb-conf.yaml
                  table_name: "{{input}}"
                source: GIT
              job_cluster_key: job_wf_lom_data_load_cluster
              min_retry_interval_millis: 60000
      job_clusters:
        - job_cluster_key: job_wf_lom_data_load_cluster
          new_cluster:
            policy_id: ${var.policy_id}
            cluster_name: ""
            spark_version: ${var.runtime}
            spark_conf:
              spark.sql.files.ignoreMissingFiles: "true"
            aws_attributes:
              first_on_demand: 1
              availability: SPOT_WITH_FALLBACK
              zone_id: auto
              instance_profile_arn: ${var.instance_profile_arn}
              spot_bid_price_percent: 100
            node_type_id: i4i.xlarge
            custom_tags:
              Environment: ${var.environment}
              GroupName: Trademark
              ComponentID: ${var.ComponentID}
              team: product
              Component: TMDC
              SubGroup: TRM
            cluster_log_conf:
              s3:
                destination: s3://bdr-databricks-app-${var.environment}/auditlogs-data/1025-213227-u87y9ym6
                  (us-east-1)
                region: us-west-2
                enable_encryption: true
                canned_acl: bucket-owner-full-control
            spark_env_vars:
              SPARK_VERSION: "3.2"
            enable_elastic_disk: true
            data_security_mode: SINGLE_USER
            runtime_engine: STANDARD
            autoscale:
              min_workers: 2
              max_workers: 12
      git_source:
        git_url: https://prod-cicm.uspto.gov/gitlab/tm-tmdc/trm-dpl.git
        git_provider: gitLabEnterpriseEdition
        git_branch: ${var.git_branch}
      run_as:
        service_principal_name: c0e8744c-4859-4397-b822-2f629cf629dc
permissions:
  - level: ${var.editor}
    group_name: ${var.editorteam}
  - level: ${var.reader}
    group_name: ${var.readerteam}
  - level: CAN_MANAGE
    service_principal_name: c0e8744c-4859-4397-b822-2f629cf629dc