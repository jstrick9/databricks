resources:
  jobs:
    wf_tmngpdb_silver_bdss_load:
      name: wf_tmngpdb_silver_bdss_load
      email_notifications:
        on_failure:
          - ODBDDataLakeTeam@uspto.gov
          - vzivkovic@uspto.gov
      notification_settings:
        no_alert_for_canceled_runs: true
      timeout_seconds: 9000
      schedule:
        quartz_cron_expression: 25 0 23 * * ?
        timezone_id: America/New_York
        pause_status: UNPAUSED
      tasks:
        - task_key: job_tmngpdb_silver_bdss_class_load
          notebook_task:
            notebook_path: notebooks/python/silver/ntb_silver_bdss_class_load
            base_parameters:
              SRC_SYS_NAME: TMNGPDB
              dbx_env: ${var.environment}
              config_file: ../config/${var.environment}/tmngpdb-conf.yaml
            source: GIT
          job_cluster_key: job_wf_lom_data_load_cluster
          max_retries: 2
          min_retry_interval_millis: 120000
