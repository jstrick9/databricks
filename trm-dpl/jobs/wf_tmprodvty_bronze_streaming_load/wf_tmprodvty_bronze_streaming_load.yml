resources:
  jobs:
    wf_tmprodvty_bronze_streaming_load:
      name: wf_tmprodvty_bronze_streaming_load
      email_notifications:
        on_success:
          - jayanth.bandi@USPTO.GOV
        on_failure:
          - jayanth.bandi@USPTO.GOV
          - ODBDDataLakeTeam@uspto.gov
      notification_settings:
        no_alert_for_canceled_runs: true
      timeout_seconds: 9000
      continuous:
        pause_status: PAUSED
      tasks:
        - task_key: ntb_tmprodvty_streaming_raw_data_load
          notebook_task:
            notebook_path: notebooks/python/bronze/ntb_tmprodvty_streaming_raw_data_load
            source: GIT
          job_cluster_key: Job_cluster
        - task_key: ntb_tmprodvty_streaming_live_table_load
          notebook_task:
            notebook_path: notebooks/python/bronze/ntb_tmprodvty_streaming_live_table_load
            source: GIT
          job_cluster_key: Job_cluster
      job_clusters:
        - job_cluster_key: Job_cluster
          new_cluster:
            policy_id: ${var.policy_id}
            cluster_name: ""
            spark_version: "16.4.x-scala2.12"
            spark_conf:
              spark.sql.files.ignoreMissingFiles: "true"
            aws_attributes:
              first_on_demand: 1
              availability: SPOT_WITH_FALLBACK
              zone_id: auto
              instance_profile_arn: ${var.instance_profile_arn}
              spot_bid_price_percent: 100
            node_type_id: i4i.xlarge
            custom_tags:
              Environment: ${var.environment}
              GroupName: Trademark
              ComponentID: ${var.ComponentID}
              team: product
              Component: TMDC
              SubGroup: TRM
            cluster_log_conf:
              s3:
                destination: s3://databricks-${var.environment}-tmdc/auditlogs-data/1025-213227-u87y9ym6
                region: us-west-2
                enable_encryption: true
                canned_acl: bucket-owner-full-control
            spark_env_vars:
              SPARK_VERSION: "3.2"
            enable_elastic_disk: true
            data_security_mode: SINGLE_USER
            runtime_engine: STANDARD
            autoscale:
              min_workers: 2
              max_workers: 12
      git_source:
        git_url: https://prod-cicm.uspto.gov/gitlab/tm-tmdc/trm-dpl.git
        git_provider: gitLabEnterpriseEdition
        git_branch: ${var.git_branch}
      run_as:
        service_principal_name: c0e8744c-4859-4397-b822-2f629cf629dc
permissions:
  - level: ${var.editor}
    group_name: ${var.editorteam}
  - level: ${var.reader}
    group_name: ${var.readerteam}
  - level: CAN_MANAGE
    service_principal_name: c0e8744c-4859-4397-b822-2f629cf629dc