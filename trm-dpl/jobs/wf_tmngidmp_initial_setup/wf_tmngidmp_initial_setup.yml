resources:
  jobs:
    wf_tmngidmp_initial_setup:
      name: wf_tmngidmp_initial_setup
      email_notifications:
        on_failure:
          - ODBDSystemsEng@uspto.gov
      tasks:
        - task_key: job_tmngidmp_execute_ddls
          notebook_task:
            notebook_path: notebooks/sql/ddls/bronze/ddls_tmngidmp_bronze
            base_parameters:
              dbx_env: ${var.environment}
            source: GIT
          job_cluster_key: Job_cluster
        - task_key: job_tmngidmp_proc_defn_rfrnc_load
          depends_on:
            - task_key: job_tmngidmp_execute_ddls
          notebook_task:
            notebook_path: notebooks/python/bronze/ntb_tmngidmp_proc_defn_rfrnc_load
            base_parameters:
              dbx_env: ${var.environment}
            source: GIT
          job_cluster_key: Job_cluster
      job_clusters:
        - job_cluster_key: Job_cluster
          new_cluster:
            policy_id: ${var.policy_id}
            cluster_name: ""
            spark_version: ${var.runtime}
            aws_attributes:
              first_on_demand: 1
              availability: SPOT_WITH_FALLBACK
              zone_id: auto
              instance_profile_arn: ${var.instance_profile_arn}
              spot_bid_price_percent: 100
              ebs_volume_count: 0
            node_type_id: i4i.large
            custom_tags:
              Component: TMDC
              ComponentID: ${var.ComponentID}
              Environment: ${var.environment}
            spark_env_vars:
              PYSPARK_PYTHON: /databricks/python3/bin/python3
            enable_elastic_disk: false
            data_security_mode: SINGLE_USER
            runtime_engine: STANDARD
            num_workers: 8
      git_source:
        git_url: https://prod-cicm.uspto.gov/gitlab/tm-tmdc/trm-dpl.git
        git_provider: gitLabEnterpriseEdition
        git_branch: ${var.git_branch}
      run_as:
        service_principal_name: c0e8744c-4859-4397-b822-2f629cf629dc
permissions:
  - level: ${var.editor}
    group_name: ${var.editorteam}
  - level: ${var.reader}
    group_name: ${var.readerteam}
  - level: CAN_MANAGE
    service_principal_name: c0e8744c-4859-4397-b822-2f629cf629dc
