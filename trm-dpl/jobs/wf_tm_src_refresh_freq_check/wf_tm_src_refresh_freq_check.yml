resources:
  jobs:
    wf_tm_src_refresh_freq_check:
      name: wf_tm_src_refresh_freq_check
      email_notifications:
        on_failure:
          - ODBDDataLakeTeam@uspto.gov
        no_alert_for_skipped_runs: true
      notification_settings:
        no_alert_for_skipped_runs: true
        no_alert_for_canceled_runs: true
      schedule:
        quartz_cron_expression: 28 12 * * * ?
        timezone_id: UTC
        pause_status: PAUSED
      tasks:
        - task_key: job_EFOIAP_brnz_data_load_frequency_check
          notebook_task:
            notebook_path: notebooks/python/bronze/ntb_tm_brnz_data_load_frequency_check
            base_parameters:
              SRC_SYS_NAME: EFOIAP
              dbx_env: ${var.environment}
              PROC_CTGRY_CD: SRC_TO_BRNZ
            source: GIT
          job_cluster_key: job_wf_lom_data_load_cluster
        - task_key: job_EOGADMIN_brnz_data_load_frequency_check
          notebook_task:
            notebook_path: notebooks/python/bronze/ntb_tm_brnz_data_load_frequency_check
            base_parameters:
              SRC_SYS_NAME: EOGADMIN
              dbx_env: ${var.environment}
              PROC_CTGRY_CD: SRC_TO_BRNZ
            source: GIT
          job_cluster_key: job_wf_lom_data_load_cluster
