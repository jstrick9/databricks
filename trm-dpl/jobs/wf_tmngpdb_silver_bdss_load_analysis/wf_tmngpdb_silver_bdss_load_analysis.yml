resources:
  jobs:
    wf_tmngpdb_silver_bdss_load_analysis:
      name: wf_tmngpdb_silver_bdss_load_analysis
      email_notifications:
        on_failure:
          - ODBDDataLakeTeam@uspto.gov
      notification_settings:
        no_alert_for_canceled_runs: true
      timeout_seconds: 9000
      schedule:
        quartz_cron_expression: 58 30 3 * * ?
        timezone_id: America/New_York
        pause_status: PAUSED
      tasks:
        - task_key: job_tmngpdb_silver_bdss_class_load_txn
          notebook_task:
            notebook_path: notebooks/python/silver/ntb_silver_tmapplser_inc_call_based_on_txn_tables
            base_parameters:
              dbx_env: ${var.environment}
              start_date: ""
              end_date: ""
              SRC_SYS_NAME: TMNGPDB
              config_file: ../config/${var.environment}/tmngpdb-conf.yaml
            source: GIT
          job_cluster_key: Job_cluster
        - task_key: job_tmngpdb_silver_bdss_class_load_txn_discrepancies
          depends_on:
            - task_key: job_tmngpdb_silver_bdss_class_load_txn
            - task_key: job_tmngpdb_silver_bdss_load_daily_event
          notebook_task:
            notebook_path: notebooks/python/silver/ntb_silver_tmapplser_inc_call_based_on_txn_tables_discrepancies
            base_parameters:
              dbx_env: ${var.environment}
              start_date: ""
              end_date: ""
              SRC_SYS_NAME: TMNGPDB
              config_file: ../config/${var.environment}/tmngpdb-conf.yaml
            source: GIT
          job_cluster_key: Job_cluster
        - task_key: job_tmngpdb_silver_bdss_class_load_hx
          notebook_task:
            notebook_path: notebooks/python/silver/ntb_silver_tmapplser_inc_call_based_on_hstry_tables
            base_parameters:
              dbx_env: ${var.environment}
              start_date: ""
              end_date: ""
              SRC_SYS_NAME: TMNGPDB
              config_file: ../config/${var.environment}/tmngpdb-conf.yaml
            source: GIT
          job_cluster_key: Job_cluster
        - task_key: job_tmngpdb_silver_bdss_class_load_hx_discrepancies
          depends_on:
            - task_key: job_tmngpdb_silver_bdss_class_load_hx
            - task_key: job_tmngpdb_silver_bdss_load_daily_event
          notebook_task:
            notebook_path: notebooks/python/silver/ntb_silver_tmapplser_inc_call_based_on_hstry_tables_discrepancies
            base_parameters:
              dbx_env: ${var.environment}
              start_date: ""
              end_date: ""
              SRC_SYS_NAME: TMNGPDB
              config_file: ../config/${var.environment}/tmngpdb-conf.yaml
            source: GIT
          job_cluster_key: Job_cluster
        - task_key: job_tmngpdb_silver_bdss_load_daily_event
          notebook_task:
            notebook_path: notebooks/python/silver/ntb_temp_summary_daily_event_analysis
            base_parameters:
              SRC_SYS_NAME: TMNGPDB
              dbx_env: ${var.environment}
              rundate: ""
              config_file: ../config/${var.environment}/tmngpdb-conf.yaml
            source: GIT
          job_cluster_key: Job_cluster
        - task_key: job_tmngpdb_silver_bdss_load_daily_ia_event
          notebook_task:
            notebook_path: notebooks/python/silver/ntb_temp_summary_daily_ia_event_analysis
            base_parameters:
              SRC_SYS_NAME: TMINTLTM
              dbx_env: ${var.environment}
              config_file: ../config/${var.environment}/tmngpdb-conf.yaml
              rundate: ""
            source: GIT
          job_cluster_key: Job_cluster
      job_clusters:
        - job_cluster_key: Job_cluster
          new_cluster:
            policy_id: ${var.policy_id}
            cluster_name: ""
            spark_version: ${var.runtime}
            aws_attributes:
              first_on_demand: 1
              availability: SPOT_WITH_FALLBACK
              zone_id: auto
              instance_profile_arn: ${var.instance_profile_arn}
              spot_bid_price_percent: 100
              ebs_volume_count: 0
            node_type_id: i4i.large
            custom_tags:
              Environment: ${var.environment}
              GroupName: Trademark
              ComponentID: ${var.ComponentID}
              Component: TMDC
              SubGroup: TRM
            spark_env_vars:
              PYSPARK_PYTHON: /databricks/python3/bin/python3
            enable_elastic_disk: false
            data_security_mode: SINGLE_USER
            runtime_engine: STANDARD
            autoscale:
              min_workers: 2
              max_workers: 8
      git_source:
        git_url: https://prod-cicm.uspto.gov/gitlab/tm-tmdc/trm-dpl.git
        git_provider: gitLabEnterpriseEdition
        git_branch: ${var.git_branch}
      run_as:
        service_principal_name: c0e8744c-4859-4397-b822-2f629cf629dc
permissions:
  - level: ${var.editor}
    group_name: ${var.editorteam}
  - level: ${var.reader}
    group_name: ${var.readerteam}
  - level: CAN_MANAGE
    service_principal_name: c0e8744c-4859-4397-b822-2f629cf629dc
