resources:
  jobs:
    wf_tmngpdb_bronze_load_group6_jdbc_logs:
      name: wf_tmngpdb_bronze_load_group6_jdbc_logs
      email_notifications:
        on_success:
          - jayanth.bandi@USPTO.GOV
        on_failure:
          - jayanth.bandi@USPTO.GOV
          - ODBDDataLakeTeam@uspto.gov
      notification_settings:
        no_alert_for_canceled_runs: true
      timeout_seconds: 54000
      schedule:
        quartz_cron_expression: 58 0 3 ? * MON-FRI
        timezone_id: America/New_York
        pause_status: UNPAUSED
      tasks:
        - task_key: job_tmngpdb_bronze_control_table_load_group6
          notebook_task:
            notebook_path: notebooks/python/bronze/ntb_cmn_bronze_job_control_load
            base_parameters:
              dbx_env: ${var.environment}
              SRC_SYS_NAME: TMNGPDB
              config_file: ../config/${var.environment}/tmngpdb-conf.yaml
              data_load_group: group6
            source: GIT
          job_cluster_key: job_wf_lom_data_load_cluster
        - task_key: job_tmngpdb_bronze_load_group6
          depends_on:
            - task_key: job_tmngpdb_bronze_control_table_load_group6
          for_each_task:
            inputs: '["STND_OFFICE_ACTION_CATEGORY","STND_OFFICE_ACTION_RULE","STND_OFFICE_ACTIVITY_REASON","STND_OFFICE_ACTVTY_RSN_CT","STND_OWNER_TYPE","STND_PAY_PERIOD","STND_PRCDNG_EMPE_ASGMT_ROLE","STND_PUBLICATION_CATEGORY","STND_PUBLICATION_SUBCATEGORY","STND_QUERY_REVIEW_STATUS","STND_REG_STMNT_TYPE","STND_RELATIONSHIP_TYPE","STND_RESPONSE_ISSUE","STND_REVIEW_ISSUE","STND_REVIEW_RATING","STND_STATEMENT_TYPE","STND_SUBMISSION_METHOD","STND_TELECOM_FORMAT","STND_TELECOM_TYPE","STND_TEMPLATE_PARA_TYPE","STND_TM_AMENDMENT_REASON","STND_TM_CLASS_STATUS","STND_TM_DIVISIONAL_STATUS","STND_TM_EMPLOYEE_ASGMT_ROLE","STND_TM_GROUP_TYPE","STND_TM_INTRSTD_PARTY_ROLE","STND_TM_PARTY_ROLE","STND_TM_REVIEW_STATUS","STND_US_INTL_CLS_MAPPING","STND_WORK_ITEM_RELTNSP_TYPE","STND_WORK_ITEM_REQUEST","STND_WORK_ITEM_TYPE","STND_WORK_ITEM_TYPE_DOC_TMPLT","STND_WORK_ITEM_TYPE_RULE","STND_WORKER_RELTNSP_TYPE","STND_WRITING_RVW_ADDL_ACTN","SUBMISSION_AVERMENT","SUBMISSION_AVERMENT_H","SUBMISSION_ELCTRN_ADDR","SUBMISSION_ELCTRN_ADDR_H","SUBMISSION_SIGNATURE","SYNC_AUTHUSER","SYNC_CASELOCK","SYNC_CHECKPOINT","SYNC_EXCEPTION_TYPE","SYNC_MIGRATION_RULES","SYNC_MIGRATION_SCRIPT","SYNC_RUNTIME","SYNC_STND_AM_STAT","SYNC_TRANLOG","SYNC_TRANSLATE_ASSUMED_NAME","SYNC_TRANSLATE_EMP_LO","SYNC_TRANSLATE_EP","SYNC_TRANSLATE_GEO","SYNC_TRANSLATE_LOCATION","SYNC_TRANSLATE_OG_CATG","SYNC_TRANSLATE_PARTY_TYPE","SYNC_TRANSLATE_PETITION_DOCKT","SYNC_TRANSLATE_WORK_ITEM_CMS","WORKER","WORKER_H","DOCUMENT_COMPONENT"]'
            concurrency: 5
            task:
              task_key: job_tmngpdb_bronze_load_group6_iteration
              notebook_task:
                notebook_path: notebooks/python/bronze/ntb_tmngpdb_bronze_jdbc_cdc_load_table_level
                base_parameters:
                  dbx_env: ${var.environment}
                  full_data_refresh: N
                  data_load_group: group6
                  SRC_SYS_NAME: TMNGPDB
                  config_file: ../config/${var.environment}/tmngpdb-conf.yaml
                  table_name: "{{input}}"
                source: GIT
              job_cluster_key: job_wf_lom_data_load_cluster
              min_retry_interval_millis: 60000
      job_clusters:
        - job_cluster_key: job_wf_lom_data_load_cluster
          new_cluster:
            policy_id: ${var.policy_id}
            cluster_name: ""
            spark_version: ${var.runtime}
            spark_conf:
              spark.sql.files.ignoreMissingFiles: "true"
            aws_attributes:
              first_on_demand: 1
              availability: SPOT_WITH_FALLBACK
              zone_id: auto
              instance_profile_arn: ${var.instance_profile_arn}
              spot_bid_price_percent: 100
            node_type_id: i4i.large
            custom_tags:
              Environment: ${var.environment}
              GroupName: Trademark
              ComponentID: ${var.ComponentID}
              team: product
              Component: TMDC
              SubGroup: TRM
            cluster_log_conf:
              s3:
                destination: s3://bdr-databricks-app-${var.environment}/auditlogs-data/1025-213227-u87y9ym6
                  (us-east-1)
                region: us-west-2
                enable_encryption: true
                canned_acl: bucket-owner-full-control
            spark_env_vars:
              SPARK_VERSION: "3.2"
            enable_elastic_disk: true
            data_security_mode: SINGLE_USER
            runtime_engine: STANDARD
            autoscale:
              min_workers: 2
              max_workers: 8
      git_source:
        git_url: https://prod-cicm.uspto.gov/gitlab/tm-tmdc/trm-dpl.git
        git_provider: gitLabEnterpriseEdition
        git_branch: ${var.git_branch}
      run_as:
        service_principal_name: c0e8744c-4859-4397-b822-2f629cf629dc
permissions:
  - level: ${var.editor}
    group_name: ${var.editorteam}
  - level: ${var.reader}
    group_name: ${var.readerteam}
  - level: CAN_MANAGE
    service_principal_name: c0e8744c-4859-4397-b822-2f629cf629dc