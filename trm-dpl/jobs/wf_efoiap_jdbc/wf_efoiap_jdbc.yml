resources:
  jobs:
    wf_efoiap_jdbc:
      name: wf_efoiap_jdbc
      timeout_seconds: 9000
      schedule:
        quartz_cron_expression: 4 19 5 * * ?
        timezone_id: America/New_York
        pause_status: UNPAUSED
      tasks:
        - task_key: tm_efoiap_jdbc
          notebook_task:
            notebook_path: notebooks/python/bronze/ntb_tmngpdb_bronze_jdbc_cdc_load
            base_parameters:
              dbx_env: ${var.environment}
              SRC_SYS_NAME: EFOIAP
              full_data_refresh: Y
            source: GIT
          job_cluster_key: Job_cluster
        - task_key: job_efoiap_bronze_data_vrfctn
          depends_on:
            - task_key: tm_efoiap_jdbc
          notebook_task:
            notebook_path: notebooks/python/shared/ntb_tm_brnz_data_vrfctn_frmwrk
            base_parameters:
              PROC_CTGRY_CD: SRC_TO_BRNZ
              SRC_SYS_NAME: EFOIAP
              dbx_env: ${var.environment}
            source: GIT
          job_cluster_key: Job_cluster
      job_clusters:
        - job_cluster_key: Job_cluster
          new_cluster:
            policy_id: ${var.policy_id}
            cluster_name: ""
            spark_version: ${var.runtime}
            aws_attributes:
              first_on_demand: 1
              availability: SPOT_WITH_FALLBACK
              zone_id: auto
              instance_profile_arn: ${var.instance_profile_arn}
              spot_bid_price_percent: 100
              ebs_volume_count: 0
            node_type_id: i4i.large
            custom_tags:
              Environment: ${var.environment}
              GroupName: Trademark
              ComponentID: ${var.ComponentID}
              Component: TMDC
              SubGroup: TRM
            spark_env_vars:
              PYSPARK_PYTHON: /databricks/python3/bin/python3
            enable_elastic_disk: false
            data_security_mode: SINGLE_USER
            runtime_engine: STANDARD
            autoscale:
              min_workers: 2
              max_workers: 8
      git_source:
        git_url: https://prod-cicm.uspto.gov/gitlab/tm-tmdc/trm-dpl.git
        git_provider: gitLabEnterpriseEdition
        git_branch: ${var.git_branch}
      run_as:
        service_principal_name: c0e8744c-4859-4397-b822-2f629cf629dc
permissions:
  - level: ${var.editor}
    group_name: ${var.editorteam}
  - level: ${var.reader}
    group_name: ${var.readerteam}
  - level: CAN_MANAGE
    service_principal_name: c0e8744c-4859-4397-b822-2f629cf629dc
