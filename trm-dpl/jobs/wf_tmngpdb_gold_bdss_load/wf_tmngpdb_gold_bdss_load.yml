resources:
  jobs:
    wf_tmngpdb_gold_bdss_load:
      name: wf_tmngpdb_gold_bdss_load
      email_notifications:
        on_failure:
          - ODBDDataLakeTeam@uspto.gov
          - vzivkovic@uspto.gov
      timeout_seconds: 9000
      health:
        rules:
          - metric: RUN_DURATION_SECONDS
            op: GREATER_THAN
            value: 7200
      schedule:
        quartz_cron_expression: 0 0 0 * * ?
        timezone_id: America/New_York
        pause_status: UNPAUSED
      tasks:
        - task_key: job_tmngpdb_gold_bdss_class_load
          notebook_task:
            notebook_path: notebooks/python/gold/ntb_gold_tmapplser
            base_parameters:
              dbx_env: ${var.environment}
              historical: "false"
              run_id: "{{job.run_id}}"
              initial_run: "false"
            source: GIT
          job_cluster_key: job_wf_tmapplser_data_load_cluster
          max_retries: 2
          min_retry_interval_millis: 120000
      job_clusters:
        - job_cluster_key: job_wf_tmapplser_data_load_cluster
          new_cluster:
            policy_id: ${var.policy_id}
            cluster_name: ""
            spark_version: ${var.runtime}
            spark_conf:
              spark.sql.files.ignoreMissingFiles: "true"
              spark.sql.legacy.allowNullComparisonResultInArraySort: "true"
            aws_attributes:
              first_on_demand: 1
              availability: SPOT_WITH_FALLBACK
              zone_id: auto
              instance_profile_arn: ${var.instance_profile_arn}
              spot_bid_price_percent: 100
            node_type_id: i4i.xlarge
            custom_tags:
              Environment: ${var.environment}
              GroupName: Trademark
              ComponentID: ${var.ComponentID}
              team: product
              Component: TMDC
              SubGroup: TRM
            cluster_log_conf:
              s3:
                destination: s3://bdr-databricks-app-${var.environment}/auditlogs-data/1025-213227-u87y9ym6
                  (us-east-1)
                region: us-west-2
                enable_encryption: true
                canned_acl: bucket-owner-full-control
            spark_env_vars:
              SPARK_VERSION: "3.5.2"
            enable_elastic_disk: true
            data_security_mode: SINGLE_USER
            runtime_engine: STANDARD
            autoscale:
              min_workers: 2
              max_workers: 8
      git_source:
        git_url: https://prod-cicm.uspto.gov/gitlab/tm-tmdc/trm-dpl.git
        git_provider: gitLabEnterpriseEdition
        git_branch: ${var.git_branch}
      run_as:
        service_principal_name: c0e8744c-4859-4397-b822-2f629cf629dc
permissions:
  - level: ${var.editor}
    group_name: ${var.editorteam}
  - level: ${var.reader}
    group_name: ${var.readerteam}
  - level: CAN_MANAGE
    service_principal_name: c0e8744c-4859-4397-b822-2f629cf629dc