# /data_quality/allowed_values/regex.yml
# Canonical, reusable regex patterns for DQ checks

# Serial numbers, registration, identifiers
SERIAL_8_DIGITS: '^[0-9]{8}$'
REG_NUMBER_7_8_DIGITS: '^[0-9]{7,8}$'
INT_POSITIVE: '^[0-9]+$'
INT_NONNEGATIVE: '^[0-9]+$'
DECIMAL_POSITIVE: '^[0-9]+(\.[0-9]+)?$'

# Dates
DATE_YYYYMMDD: '^[0-9]{8}$'              # e.g., 20240131
DATE_YYYY_MM_DD: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
DATE_MM_DD_YYYY: '^[0-9]{2}/[0-9]{2}/[0-9]{4}$'

# Country codes
COUNTRY_ALPHA2: '^[A-Z]{2}$'
COUNTRY_ALPHA3: '^[A-Z]{3}$'

# US ZIP codes
ZIP_US_5_OR_9: '^[0-9]{5}(-[0-9]{4})?$'

# Email
EMAIL_SIMPLE: '^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$'

# URLs
URL_HTTP_HTTPS: '^(https?://)[^\\s/$.?#].[^\\s]*$'

# Names and text
UPPERCASE_ALPHANUMERIC: '^[A-Z0-9]+$'
ALPHANUMERIC_WITH_SPACES: '^[A-Za-z0-9 ]+$'
NO_CONTROL_CHARS: '^[^\\x00-\\x1F\\x7F]+$'

# Misc
BOOLEAN_YN: '^[YN]$'
FLAG_0_1: '^[01]$'
LAW_OFFICE_CODE: '^[0-9]{3}$|^L[0-9A-Z]{2}$|^SUP$'