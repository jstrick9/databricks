# /data_quality/checks/trm_reporting/silver/fpep_fact_checks.yml
checks:
  - criticality: warn
    check:
      function: is_not_null
      arguments:
        column: FP_ID
  
  - criticality: warn
    check:
      function: is_not_null
      arguments:
        column: ser_num

  - criticality: warn
    check:
      function: is_not_null
      arguments:
        column: FK_WRKR_ID

  - criticality: warn
    check:
      function: is_not_null
      arguments:
        column: CATEGORY

  - criticality: warn
    check:
      function: is_not_null
      arguments:
        column: ACTION_COUNT

  - criticality: warn
    check:
      function: is_not_null
      arguments:
        column: COMPLETED_DT

  - criticality: warn
    check:
      function: is_not_null
      arguments:
        column: FP_YEAR

  - criticality: warn
    check:
      function: is_unique_and_immutable
      arguments:
        col_name: FP_ID

  - criticality: warn
    check:
      function: valid_fpep_category

  - criticality: error
    check:
      function: fiscal_year_matches_date
      arguments:
        fiscal_year_col: FP_YEAR
        date_col: COMPLETED_DT